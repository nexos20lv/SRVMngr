name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparer la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          export BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION=$(node -p "const [major, minor] = process.env.BASE.split('.'); major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifacts: |
              release/*.dmg
              release/*-mac.zip
              release/*.blockmap
              release/*.yml
          - os: windows-latest
            script: dist:win
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/*.nsis.7z
              release/*.yml
          - os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.blockmap
              release/*.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Définir la version de cette release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version --no-git-tag-version "$RELEASE_VERSION"

      # Les builds ne sont pas signés : pas de certificat à chercher.
      - name: Construire l'installeur
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Vérifier qu'aucun seed n'est embarqué
        shell: bash
        run: |
          if find release -name "*.seed.json" | grep -q .; then
            echo "::error::Un fichier seed se trouve dans les artefacts : identifiants exposés !"
            exit 1
          fi
          echo "Artefacts propres."

      - uses: actions/upload-artifact@v4
        with:
          name: srvmngr-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publier la Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: SRV Mngr v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Installeurs non signés : au premier lancement, clic droit → Ouvrir
            (macOS) ou « Informations complémentaires → Exécuter quand même » (Windows).

            Aucun identifiant n'est embarqué : les serveurs s'ajoutent dans l'application.
