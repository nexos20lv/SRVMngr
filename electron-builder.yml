appId: in.nxslab.srvmngr
productName: SRV Mngr
copyright: Pierre
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,test,__tests__,docs,example}'
# Aucun hosts.seed.json n'est embarqué : l'application démarre vide et les serveurs
# s'ajoutent depuis l'interface. Le fichier reste utilisable en développement seulement.
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  target:
    - nsis
    - portable
  artifactName: ${name}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SRV Mngr
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}
  executableName: srvmngr
  synopsis: Gestionnaire de serveurs Linux par SSH
  description: Panneau de contrôle multi-serveurs avec SSH, Docker, systemd et nginx
publish:
  provider: github
  owner: nexos20lv
  repo: SRVMngr
  releaseType: release
